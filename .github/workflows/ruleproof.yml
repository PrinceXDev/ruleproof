name: RuleProof

on:
  push:
  pull_request:

jobs:
  enforce-access-rules:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ruleproof-test
          POSTGRES_DB: ruleproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go tests
        env:
          RULEPROOF_TEST_POSTGRES: postgres://postgres:ruleproof-test@localhost:5432/ruleproof_test?sslmode=disable
        run: go test -race ./internal/... ./cmd/...

      - name: Go static analysis
        run: go vet ./internal/... ./cmd/...

      # The approved plan must hold against the corrected API, including every
      # bypass variant. Any mismatch fails this step and shows up as
      # annotations plus a job summary.
      - name: Enforce approved access rules
        run: go run ./cmd/ruleproof-ci -bundle examples/tenant-isolation.bundle.json -fixture fixed -bypass -junit ruleproof-junit.xml

      # The revision that closes the export coverage gap must hold too.
      - name: Enforce approved access rules (with export)
        run: go run ./cmd/ruleproof-ci -bundle examples/tenant-isolation-export.bundle.json -fixture fixed -bypass -junit ruleproof-export-junit.xml

      # Proves the gate has teeth: the same plans must fail on the seeded defect.
      - name: Seeded defect is caught
        # Unset GitHub mode so expected failures don't become red annotations.
        run: |
          for bundle in tenant-isolation tenant-isolation-export; do
            if env -u GITHUB_ACTIONS -u GITHUB_STEP_SUMMARY go run ./cmd/ruleproof-ci -bundle examples/$bundle.bundle.json -fixture broken > broken.txt; then
              echo "::error::RuleProof did not catch the seeded cross-tenant defect with $bundle"
              exit 1
            fi
            cat broken.txt
          done

      # Proves bypass variants earn their place: the partial fix passes every
      # approved check, so only -bypass can catch it.
      - name: Partial fix is caught only by bypass variants
        run: |
          bundle=examples/tenant-isolation-export.bundle.json
          env -u GITHUB_ACTIONS -u GITHUB_STEP_SUMMARY go run ./cmd/ruleproof-ci -bundle $bundle -fixture partial
          if env -u GITHUB_ACTIONS -u GITHUB_STEP_SUMMARY go run ./cmd/ruleproof-ci -bundle $bundle -fixture partial -bypass > partial.txt; then
            echo "::error::Bypass variants did not catch the partial fix"
            exit 1
          fi
          cat partial.txt

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruleproof-junit
          path: ruleproof-*junit.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Generate Next.js types and check TypeScript
        run: npm run typecheck
      - run: npm run lint
      - run: npm run build
